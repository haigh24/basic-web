<p id="name"></p>

<script>
    let name = ["Hai", "Cao", "Huy", "Le"];
    let flen = name.length;
     let a = "<ul>";
     for (let i = 0; i < flen; i++) {
         a += "<li>" + name[i] + "</li>";
     }
     a += "</ul>";
     document.getElementById("name") =  a ;
</script>










<p id="student"></p>
<script>
const student = ["Minh", "Hieu", "Quang" ];

let text= "<ul>";
student.forEach(myFunction);
text += "</ul>";
document.getElementById("student").innerHTML = text ;

function myFunction(value) {
    text += "<li>" + value + "</li>";
}
</script>

<p id="medo"></p>

<script>
const numbers = [4, 9, 16, 25, 29];

document.getElementById("medo").innerHTML = "First number over 18 is " + first;

function myFunction(value, index, array) {

}
</script>

<p id="demo"></p>

<script>
const temp = [27, 28, 30, 40, 42, 35, 30];
